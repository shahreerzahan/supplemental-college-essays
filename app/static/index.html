<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Unwritten Shelf</title>
  <meta name="description" content="Supplemental essay prompts for top US colleges, Oxford and Cambridge, shelved like books.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">
  <link rel="stylesheet" href="/static/shelf.css">
</head>
<body>
  <header class="masthead wrap">
    <div class="masthead-top">
      <div>
        <h1 class="title">The Unwritten Shelf</h1>
        <p class="tagline">every essay you haven't written yet</p>
      </div>
      <button class="surprise" id="surprise" type="button">Surprise me</button>
    </div>

    <p class="count" id="count">&nbsp;</p>

    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path>
      </svg>
      <input id="search" type="search" placeholder="What are you looking for?" autocomplete="off" spellcheck="false" aria-label="Search prompts, schools and essays">
    </label>

    <div class="chips" id="type-chips" role="group" aria-label="Filter by type"></div>
    <div class="chips" id="school-chips" role="group" aria-label="Filter by school"></div>

    <p class="status" id="status" aria-live="polite"></p>
  </header>

  <main class="wrap">
    <section class="bookcase" id="bookcase" aria-label="Bookshelf"></section>

    <div class="empty" id="empty" hidden>
      <p class="empty-big">No books<br>here.</p>
      <p>Try another word, or <button class="inline-link" type="button" id="clear">clear the filters</button>.</p>
    </div>

    <p class="hint">Hover a book to see it · click to open</p>
  </main>

  <footer class="wrap footer">
    Prompts copied from each school's official admissions page (and ucas.com), checked 25 October 2026.
  </footer>

  <div class="tip" id="tip" role="tooltip" aria-hidden="true"></div>

  <div class="backdrop" id="backdrop" hidden>
    <article class="card" id="card" role="dialog" aria-modal="true" aria-labelledby="card-title"></article>
  </div>

  <script src="/static/shelf.js"></script>
</body>
</html>
